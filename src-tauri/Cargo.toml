[package]
name = "sakipet"
version = "0.1.2"
description = "A cute animated desktop pet rendered from a V2 sprite atlas"
authors = ["Ruomu Anshi"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sakipet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rand = "0.9"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
xcap = { version = "0.9", features = ["image"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_WindowsAndMessaging",
] }
xcap = { version = "0.9", features = ["image"] }
windows-core = "0.61"

# debuginfo=2 makes rustc 1.88 crash (0xc0000409, stack fail-fast) while
# compiling tauri-utils/brotli on Windows. Disable dev debug info so the same
# Cargo.toml builds on both Windows and macOS.
[profile.dev]
debug = 0
