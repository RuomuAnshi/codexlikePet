name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish (Windows)
    runs-on: windows-latest

    env:
      COPYFILE_DISABLE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (updater.latest.json / .sig). The
          # private key and password only exist as repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: __VERSION__
          releaseName: SakiPet v__VERSION__
          releaseBody: |
            ## SakiPet

            一个可爱的桌面宠物，支持多种宠物资源、独立设置、互动台词、拖拽移动、
            宠物间对话、关系记忆、全屏覆盖显示和自动更新（Windows）。

            本版本仅构建 Windows 安装包。macOS 需要代码签名与公证后才可用，暂不发布。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          releaseAssetNamePattern: SakiPet-[platform]-[arch]-[bundle][ext]