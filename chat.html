<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SakiPet</title>
    <link rel="stylesheet" href="/src/chat.css" />
  </head>
  <body class="compact-chat">
    <main class="chat-shell">
      <div id="drag-handle" class="drag-handle" title="拖动聊天窗口" aria-label="拖动聊天窗口"></div>
      <section id="messages" class="messages" aria-live="polite"></section>
      <p id="status" class="status" role="status"></p>
      <form id="composer" class="composer">
        <textarea id="input" rows="2" maxlength="4000" placeholder="说点什么…"></textarea>
        <div class="composer-footer">
          <div>
            <button id="close" class="ghost-button" type="button">关闭</button>
            <button id="stop" class="ghost-button" type="button" hidden>停止</button>
            <button id="send" class="primary-button" type="submit">发送</button>
          </div>
        </div>
      </form>
    </main>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
