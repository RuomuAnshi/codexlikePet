<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宠物日志</title>
    <link rel="stylesheet" href="/src/social-log.css" />
  </head>
  <body>
    <main class="log-page">
      <header class="log-header">
        <div>
          <p class="eyebrow">SAKIPET SOCIAL</p>
          <h1>宠物日志</h1>
          <p>看看它们什么时候靠近、玩耍，以及关系如何慢慢变化。点击宠物名称可以预览。</p>
        </div>
        <button id="clear-log" class="secondary" type="button">清空日志</button>
      </header>
      <section id="pet-preview" class="pet-preview" aria-labelledby="preview-title">
        <div class="preview-stage" aria-hidden="true">
          <canvas id="preview-canvas" width="192" height="208"></canvas>
        </div>
        <div class="preview-copy">
          <p class="eyebrow">CURRENT PET</p>
          <h2 id="preview-title">选择一只宠物</h2>
          <p id="preview-description">点击关系卡或日志中的宠物名称，查看它的待机预览。</p>
          <p id="preview-meta" class="relationship-meta"></p>
        </div>
      </section>
      <section class="filters" aria-label="日志筛选">
        <label>宠物 <select id="pet-filter"><option value="">全部</option></select></label>
        <label>互动 <select id="type-filter"><option value="">全部</option></select></label>
        <button id="refresh" class="secondary" type="button">刷新</button>
      </section>
      <p id="status" class="status">正在读取……</p>
      <section class="conversation-section" aria-labelledby="conversation-title">
        <div class="conversation-heading">
          <div>
            <p class="eyebrow">RECENT CHAT</p>
            <h2 id="conversation-title">最近与宠物的对话</h2>
          </div>
          <span id="conversation-status" class="relationship-meta">最近 30 条</span>
        </div>
        <div id="conversation-list" class="conversation-list" aria-live="polite"></div>
      </section>
      <section id="relationship-list" class="relationship-list" aria-label="关系"></section>
      <section id="log-list" class="log-list" aria-live="polite"></section>
    </main>
    <script type="module" src="/src/social-log.ts"></script>
  </body>
</html>
